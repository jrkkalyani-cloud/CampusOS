<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1422"/>
      <stop offset="50%" stop-color="#101d30"/>
      <stop offset="100%" stop-color="#050e1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#00daf3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#4F8CFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#2c3545" stroke-width="4"/>
  <!-- Campus Hexagon Node Core -->
  <polygon points="256,90 380,162 380,306 256,378 132,306 132,162" fill="#16202f" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Circuit Nodes -->
  <circle cx="256" cy="90" r="14" fill="#4edea3"/>
  <circle cx="380" cy="162" r="14" fill="#00daf3"/>
  <circle cx="380" cy="306" r="14" fill="#4F8CFF"/>
  <circle cx="256" cy="378" r="14" fill="#4edea3"/>
  <circle cx="132" cy="306" r="14" fill="#00daf3"/>
  <circle cx="132" cy="162" r="14" fill="#4F8CFF"/>
  <!-- Center Core: Stylized C and OS -->
  <path d="M 230 190 C 180 190 170 230 170 256 C 170 282 180 322 230 322 C 265 322 278 300 282 286" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <circle cx="320" cy="256" r="28" fill="none" stroke="url(#accent)" stroke-width="16"/>
  <!-- Pulse Dot -->
  <circle cx="256" cy="256" r="8" fill="#4edea3"/>
  <!-- Brand text tag below -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#d9e3f7" text-anchor="middle" letter-spacing="4">CAMPUS<tspan fill="#4F8CFF">OS</tspan></text>
</svg>
